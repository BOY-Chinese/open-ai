[package]
name = "open-ai-desktop"
version = "3.0.0"
description = "open-ai 账号管理桌面端"
authors = ["BOY-Chinese"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘。v3.0 起桌面端取代 Python GUI 成为默认界面，
#            而托盘原先只在 gui_account_manager.py 里创建 → 必须由本进程自建，
#            否则表现为「后端在跑，但托盘里没有图标」（虚拟机实测反馈）。
# image-png：托盘图标经 include_image! 内嵌 32x32 PNG，不依赖运行期文件，
#            避免安装目录被移动/精简后托盘显示空白。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 单实例：第二次双击快捷方式时唤醒已有窗口，避免「双托盘 + 双窗口」
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# custom-protocol 是 Tauri 的**生产构建开关**：
#   启用 → 前端资源经 tauri:// 协议从二进制内嵌资源加载（无需 dev server）
#   未启用 → 即便配了 frontendDist，release 包仍会去连 devUrl(127.0.0.1:1420)，
#            在没有 dev server 的机器上表现为 ERR_CONNECTION_REFUSED。
# 这正是 v3.0 首个安装包在虚拟机上打不开页面的根因（已修）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
