[package]
name = "open-ai-desktop"
version = "3.0.0"
description = "open-ai 账号管理桌面端"
authors = ["BOY-Chinese"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与 Python 网关 (127.0.0.1:8000) 通信，后续接真实后端时启用
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }

[features]
default = []
# 启用后 Tauri 命令直接转发到本地 FastAPI 网关
backend-http = ["dep:reqwest"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
